name: Krypton Android Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy SDK package "tools" is no longer published by Google.
          # Request only platform-tools; setup-android also installs current
          # command-line tools and accepts Android SDK licences.
          packages: 'platform-tools'

      - name: Install Android platform packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate native Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(find . -type f -name 'settings.gradle.kts' -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "Could not find settings.gradle.kts. This repository is not laid out as a Gradle Android project." >&2
            exit 1
          fi
          for required in build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml selfcheck.py; do
            if [[ ! -f "$PROJECT_ROOT/$required" ]]; then
              echo "Missing required project file: $PROJECT_ROOT/$required" >&2
              exit 1
            fi
          done
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $PROJECT_ROOT"

      - name: Run repository self-check and build APK
        working-directory: ${{ steps.project.outputs.project_root }}
        run: python3 selfcheck.py --build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: krypton-player-debug-apk
          path: ${{ steps.project.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
